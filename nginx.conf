# ─────────────────────────────────────────────────────
# Nginx Configuration for React SPA (Single Page App)
# ─────────────────────────────────────────────────────
#
# React एक SPA है — सिर्फ एक index.html है।
# सारी routing JavaScript में होती है।
#
# Problem:
# User directly /dashboard URL पर जाए तो
# Nginx सोचता है "dashboard नाम की file कहाँ है?"
# File नहीं मिलती → 404 Error
#
# Solution:
# हर request के लिए index.html दो
# React Router खुद handle करेगा routing

server {
    # Port 80 पर सुनो (HTTP का default port)
    listen 8080;

    # Root directory — यहाँ हमारी built files होंगी
    root /usr/share/nginx/html;

    # Default file
    index index.html;

    # Gzip compression — files छोटी होकर जाएंगी browser को
    # Internet पर कम data जाएगा → faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        # पहले exact file ढूंढो
        # फिर directory ढूंढो
        # कुछ नहीं मिला तो index.html दो (React Router handle करेगा)
        try_files $uri $uri/ /index.html;
    }

    # Static assets को cache करो
    # Browser दोबारा download नहीं करेगा → faster
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}

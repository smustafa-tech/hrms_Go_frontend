# ╔══════════════════════════════════════════════════════════════╗
# ║           HRMS Frontend — CI/CD Pipeline                    ║
# ║                                                             ║
# ║  जब भी main branch पर code push हो:                        ║
# ║  1. React app build होगी                                   ║
# ║  2. Docker image बनेगी                                     ║
# ║  3. Docker Hub पर push होगी                                ║
# ╚══════════════════════════════════════════════════════════════╝

name: HRMS Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ───────────────────────────────────────────────────────────
  # JOB 1 — Build & Test
  # Purpose: React app build होती है? कोई error तो नहीं?
  # ───────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Node.js setup
      # React/Vite को Node.js चाहिए
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'   # npm cache करो → fast build

      # Step 3 — Dependencies install
      # package-lock.json से exact versions install करो
      - name: Install dependencies
        run: npm ci

      # Step 4 — Build check
      # vite build चलाओ → dist/ folder बनेगा
      # अगर कोई import error है → यहाँ fail होगा
      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────
  # JOB 2 — Docker Build & Push
  # Purpose: Docker image बनाओ और Docker Hub पर push करो
  # ───────────────────────────────────────────────────────────
  docker:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker image build और push
      # hrmsmustafa/hrms-frontend:latest → Docker Hub पर
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hrms-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/hrms-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
